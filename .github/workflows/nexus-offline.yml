name: Nexus 3 offline image bundle
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Pinned official Nexus image tag'
        required: true
        default: '3.98.1'
        type: string
jobs:
  bundle:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download Nexus amd64 and split bundle
        shell: bash
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          mkdir -p parts metadata
          IMAGE="sonatype/nexus3:${TAG}"
          docker pull --platform linux/amd64 "$IMAGE"
          docker image inspect "$IMAGE" --format '{{.Id}}' > metadata/image-id.txt
          printf '%s\n' "$IMAGE" > metadata/image-name.txt
          docker save "$IMAGE" | gzip -1 > nexus-image.tar.gz
          sha256sum nexus-image.tar.gz > metadata/archive.sha256
          split -b 400M -d -a 2 nexus-image.tar.gz parts/nexus-image.tar.gz.part-
          (cd parts && sha256sum nexus-image.tar.gz.part-*) > metadata/parts.sha256
          ls -lh parts/*
      - name: Upload manifest and checksums
        uses: actions/upload-artifact@v4
        with:
          name: nexus-metadata
          path: metadata/
          compression-level: 0
          retention-days: 7
      - name: Upload part 00
        uses: actions/upload-artifact@v4
        with:
          name: nexus-part-00
          path: parts/nexus-image.tar.gz.part-00
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Upload part 01
        uses: actions/upload-artifact@v4
        with:
          name: nexus-part-01
          path: parts/nexus-image.tar.gz.part-01
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Upload part 02
        uses: actions/upload-artifact@v4
        with:
          name: nexus-part-02
          path: parts/nexus-image.tar.gz.part-02
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Upload part 03
        uses: actions/upload-artifact@v4
        with:
          name: nexus-part-03
          path: parts/nexus-image.tar.gz.part-03
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Upload part 04
        uses: actions/upload-artifact@v4
        with:
          name: nexus-part-04
          path: parts/nexus-image.tar.gz.part-04
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Upload part 05
        uses: actions/upload-artifact@v4
        with:
          name: nexus-part-05
          path: parts/nexus-image.tar.gz.part-05
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
